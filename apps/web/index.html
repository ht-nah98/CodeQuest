<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeQuest</title>
    <meta name="theme-color" content="#4b4673" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Before the bundle: no eval probe under the CSP (public/boot/zod-jitless.js). -->
    <script src="/boot/zod-jitless.js"></script>
    <!-- Every screen has Vietnamese text in body + display fonts; fetch those faces before CSS asks. -->
    <link
      rel="preload"
      href="/fonts/nunito-vietnamese.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/baloo2-vietnamese.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
